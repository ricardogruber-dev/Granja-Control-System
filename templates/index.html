<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Despesas - Granja Control</title>
</head>
<body class="position-relative" style="background-image: url('../static/Gemini_Generated_Image_31ppcq31ppcq31pp.png'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed;">

    <a href="{{ url_for('menu_principal') }}" class="btn btn-dark bg-opacity-75 text-white position-absolute top-0 start-0 m-3 shadow border border-secondary rounded-3 d-flex align-items-center gap-2 fw-bold">
        <span>⬅</span> Menu
    </a>

    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">
        
        <form class="p-4 bg-light rounded border shadow mb-4" style="width: 100%; max-width: 500px;" method="POST" action="/Despesas">
            <h5 class="fw-bold mb-3 text-center">Cadastrar Nova Despesa</h5>
            <div class="mb-3">
                <label for="inputDespesa" class="form-label fw-semibold">Nome da Despesa</label>
                <input type="text" name="nome_categoria" class="form-control" id="inputDespesa" placeholder="" required>
            </div>
            <button type="submit" class="btn btn-secondary w-100 fw-bold">Cadastrar Categoria</button>
        </form>

        <form class="p-4 bg-light rounded border shadow" style="width: 100%; max-width: 500px;" method="POST" action="/registrar_despesa_gasto">
            <h5 class="fw-bold mb-3 text-center">Lançar Valor de Gasto</h5>
            <div class="mb-3">
                <label for="Despesa" class="form-label fw-semibold">Escolha a Despesa</label>
                <select id="Despesa" name="EscolherDespesa" class="form-select" required>
                    <option value="" disabled selected>Selecione uma opção</option>
                    {% for cat in categorias %}
                        <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
              
            <div class="mb-3">
                <label for="inputvalor" class="form-label fw-semibold">Insira o Valor (R$)</label>
                <input type="number" step="0.01" min="0" name="valor" class="form-control" id="inputvalor" placeholder="0,00" required>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold">Registrar Gasto</button>
        </form>
    </div>
</body>
</html>
