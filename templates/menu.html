<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Granja Control - Menu</title>
</head>
<body class="position-relative" style="background-image: url('../static/Gemini_Generated_Image_31ppcq31ppcq31pp.png'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed;">
    <div class="container min-vh-100 d-flex flex-column align-items-center py-4">
        
        <!-- TÍTULO NO TOPO -->
        <div class="p-4 rounded border shadow text-center mt-2 mb-auto" style="background-color: #4A2E11; width: 100%; max-width: 480px;">
            <h1 class="fw-extrabold mb-0 text-white display-3 text-uppercase" style="letter-spacing: 2px;">GRANJA CONTROL</h1>
            <hr class="my-2 border-2 border-white opacity-25">
            <small class="text-white fw-bold text-uppercase" style="letter-spacing: 1px;">Sistema de Gestão</small>
        </div>

        <!-- OPÇÕES -->
        <div class="p-4 bg-light rounded border shadow mb-auto" style="width: 100%; max-width: 400px;">
            <h5 class="fw-bold mb-3 text-center text-dark">Selecione a Opção</h5>

            <div class="d-grid gap-2">
                <a href="{{ url_for('index') }}" class="btn text-white fw-bold py-2 text-start px-3 d-flex justify-content-between align-items-center" style="background-color: #4A2E11; border-color: #4A2E11;">
                    Despesas
                    <small class="text-white">➔</small>
                </a>
                <a href="{{ url_for('tela_ovos') }}" class="btn text-white fw-bold py-2 text-start px-3 d-flex justify-content-between align-items-center" style="background-color: #4A2E11; border-color: #4A2E11;">
                    Coleta de Ovos
                    <small class="text-white">➔</small>
                </a>
                <a href="{{ url_for('tela_faturamento') }}" class="btn text-white fw-bold py-2 text-start px-3 d-flex justify-content-between align-items-center" style="background-color: #4A2E11; border-color: #4A2E11;">
                    Faturamento Diário
                    <small class="text-white">➔</small>
                </a>
                <a href="{{ url_for('tela_lucro') }}" class="btn text-white fw-bold py-2 text-start px-3 d-flex justify-content-between align-items-center mt-2" style="background-color: #4A2E11; border-color: #4A2E11;">
                    Lucro Mensal
                    <small class="text-white">➔</small>
                </a>
            </div>
        </div>

    </div>
</body>
</html>
